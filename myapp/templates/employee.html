{% load static %}
{% include 'header.html' %}

<!-- Main Content -->
<main class="main users chart-page" id="skip-target">
  <div class="container ms-3">
    <h2 class="main-title text-center mb-4">Add Agent</h2>

    <div class="row">
      <div class="col-lg-8 offset-lg-2"> <!-- Adds space on left and right -->
        <div class="users-table table-wrapper bg-light p-4 rounded shadow">

          {% if success %}
            <p class="alert alert-success">{{ success }}</p>
          {% endif %}

          <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <!-- Row 1: Username and Password -->
            <div class="row mb-3">
              <div class="col-md-6">
                <label>Username (Email):</label>
                <input type="text" name="username" class="form-control border border-success" required>
              </div>
              <div class="col-md-6">
                <label>Password:</label>
                <input type="password" name="password" class="form-control border border-success" required>
              </div>
            </div>

            <!-- Row 2: Mobile No and Address -->
            <div class="row mb-3">
              <div class="col-md-6">
                <label>Mobile No:</label>
                <input type="number" name="mobile_no" class="form-control border border-success" required>
              </div>
              <div class="col-md-6">
                <label>Address:</label>
                <input type="text" name="address" class="form-control border border-success" required>
              </div>
            </div>

            <!-- Row 3: Employee Name and Type -->
            <div class="row mb-3">
              <div class="col-md-6">
                <label>Employee Name:</label>
                <input type="text" name="emp_name" class="form-control border border-success" required>
              </div>
              <div class="col-md-6">
                <label>Employee Type:</label>
                <input type="text" name="emp_type" class="form-control border border-success" required>
              </div>
            </div>

            <!-- Upload Aadhar -->
            <div class="mb-3">
              <label>Upload Aadhar:</label>
              <input type="file" name="upload_aadhar" class="form-control border border-success" accept="image/*" required>
            </div>

            <!-- Submit Button -->
            <div class="text-center mt-4">
              <button class="btn btn-success px-5" type="submit">Submit</button>
            </div>

          </form>
        </div>
      </div>
    </div>
  </div>
</main>

{% include 'footer.html' %}
