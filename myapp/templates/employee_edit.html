{% load static %}
{% include 'header.html' %}
<!-- ! Main -->
<main class="main users chart-page" id="skip-target">
  <div class="container py-4">
    <h2 class="main-title text-center">Edit Employee</h2>

    <div class="row justify-content-center">
      <div class="col-lg-10 col-xl-8">
        <div class="users-table table-wrapper p-4 shadow rounded bg-light">
          {% if success %}
            <p class="alert alert-success"> {{ success }}</p>
          {% endif %}

          <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {% with r=data.0 %}

            <div class="row mb-3">
              <div class="col-md-12">
                <label class="form-label">Username:</label>
                <input type="email" value="{{ r.username }}" readonly name="username" class="form-control border-success">
              </div>
             
            </div>

            <div class="row mb-3">
              <div class="col-md-6">
                <label class="form-label">Mobile No:</label>
                <input type="number" value="{{ r.mobile_no }}" name="mobile_no" class="form-control border-success">
              </div>
              <div class="col-md-6">
                <label class="form-label">Address:</label>
                <input type="text" value="{{ r.address }}" name="address" class="form-control border-success">
              </div>
            </div>

            <div class="row mb-3">
              <div class="col-md-6">
                <label class="form-label">Employee Name:</label>
                <input type="text" value="{{ r.emp_name }}" name="emp_name" class="form-control border-success">
              </div>
              <div class="col-md-6">
                <label class="form-label">Employee Type:</label>
                <input type="text" value="{{ r.emp_type }}" name="emp_type" class="form-control border-success">
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">Upload Aadhaar:</label>
              <input type="file" name="upload_aadhar" class="form-control border-success">
              {% if r.upload_aadhar %}
              <p class="mt-2">Current: <a href="{{ r.upload_aadhar.url }}" target="_blank">View Aadhaar</a></p>
              {% endif %}
            </div>

            <div class="d-grid">
              <button class="btn btn-success mt-3" type="submit">Submit</button>
            </div>

            {% endwith %}
          </form>
        </div>
      </div>
    </div>
  </div>
</main>
{% include 'footer.html' %}
